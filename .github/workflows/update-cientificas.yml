name: Update cientificas.json

on:
  repository_dispatch:
    types: [save_scientists]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Overwrite cientificas.json
        run: |
          set -x
          echo "DEBUG payload (full): ${{ toJSON(github.event.client_payload) }}"
          echo "DEBUG scientists array: ${{ toJSON(github.event.client_payload.scientists) }}"
          cat <<'EOF' > cientificas.json
          ${{ toJSON(github.event.client_payload.scientists) }}
          EOF
          npx prettier --parser json --write cientificas.json

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cientificas.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Update cientificas.json (auto)"
            git push origin HEAD:main
          fi
